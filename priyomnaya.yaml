# Договор с Приёмной — личным ботом замечаний владельца.
# По замечанию владельца агент без окна правит копию сайта, владелец смотрит снимки и сам
# нажимает «Выложить». Ничего про сервер здесь нет и быть не должно: репозиторий открытый.

imya: Тет Ришонот
sinonimy: [тет ришонот, тет, тетришонот, tet rishonot, tet, сайт тет, сайт тет ришонот]
vetka: master
opisanie: >-
  Сайт музыкального проекта Тет Ришонот: одна страница index.html (разметка, стили и скрипты внутри),
  картинки лежат рядом. Публикуется GitHub Pages на домене из файла CNAME.
mozhno_menyat: ['^index\.html$']
proverka: staticheskij_sajt   # страница разбирается, блоки закрыты, все картинки на месте
snimki: da                    # снимки «было/стало» — компьютер и телефон
vykladka: git-push            # отправка в GitHub = сайт обновился
sajt: http://tetrishonot.com/
model: sonnet
