# Договор с Приёмной — личным ботом замечаний владельца.
# По замечанию владельца агент без окна правит копию сайта, владелец смотрит снимки и сам
# нажимает «Выложить». Ничего про сервер здесь нет и быть не должно: репозиторий открытый.

imya: Тет Ришонот
sinonimy: [тет ришонот, тет, тетришонот, tet rishonot, tet, сайт тет, сайт тет ришонот]
vetka: master
opisanie: |-
  Сайт музыкального проекта Тет Ришонот: одна страница index.html (разметка, стили и скрипты внутри),
  картинки лежат рядом и в img/. Публикуется GitHub Pages на домене из файла CNAME.

  КАРТА СТРАНИЦЫ — как её называет владелец (сверяй его слова с ней, а не со своей догадкой):
  - «главная», «главная страница», «первый экран», «заставка», «обложка сайта», «шапка с фото» —
    первый экран, раздел #home: БОЛЬШАЯ фоновая картинка во весь экран (.hero-bg img, сейчас «poster 2.JPEG»).
    Надпись-логотип нарисована прямо на этой картинке — меняется только заменой картинки целиком.
  - «логотип в меню», «значок», «маленький логотип» — картинка слева в верхнем меню (.nav-logo-wrap img).
    Просто «логотип» без уточнения — двусмысленно: спроси, какой (в меню или на заставке).
  - «о проекте», «биография» — #about; «музыка», «альбомы», «обложки» — #music; «видео» — #video;
    «фото», «галерея» — #photo; «контакты», «подвал» — #contact и низ страницы.
  Новая заставка от владельца — готовая картинка целиком: ставь её вместо фоновой, ничего не накладывай сверху.
mozhno_menyat: ['^index\.html$', '^img/[\w.-]+\.(jpg|jpeg|png|webp|gif)$']   # страница и новые картинки в img/
proverka: staticheskij_sajt   # страница разбирается, блоки закрыты, все картинки на месте
snimki: da                    # снимки «было/стало» — компьютер и телефон
vykladka: git-push            # отправка в GitHub = сайт обновился
sajt: http://tetrishonot.com/
model: sonnet
